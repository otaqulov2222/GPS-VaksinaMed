<!DOCTYPE html>
<html lang="uz">
<head>
<script src="canonical-url.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Davomat — VAKSINA-GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css?v=30"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="attendance.css?v=46"/>
</head>
<body class="app-body">
<input type="checkbox" id="nav-open" class="nav-open-cb" tabindex="-1" aria-hidden="true">
<label for="nav-open" class="nav-scrim" aria-hidden="true"></label>

<div class="app-shell">
  <aside class="nav-rail">
    <div class="nav-brand">
      <img src="/logo/mark.svg?v=3" alt="">
      <div>
        <div class="tb-name">VAKSINA <span>MED</span></div>
        <div class="tb-line">MACHINE CONTROL</div>
      </div>
    </div>
    <nav class="nav-links" id="side-nav">
      <a class="nav-link staff-only" href="/" id="nav-vhk" hidden>Dashboard</a>
      <a class="nav-link staff-only" href="/fuel" id="nav-fuel" hidden>Boshqaruv</a>
      <a class="nav-link staff-only" href="/live" id="nav-live" hidden>Live</a>
      <a class="nav-link on" href="/attendance" id="nav-davomat" aria-current="page">Davomat</a>
      <a class="nav-link staff-only" href="/admin" id="btn-admin-panel" hidden>Admin panel</a>
      <a class="nav-link driver-only" href="/driver" id="nav-driver" hidden>Kabinet</a>
    </nav>
    <div class="nav-foot">
      <a class="nav-link" href="/profile">Profil</a>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <label for="nav-open" class="nav-burger" title="Menyu" aria-label="Menyu">
        <span class="nav-burger-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
        <span class="nav-burger-lbl">Menyu</span>
      </label>
      <div>
        <div class="top-title">Davomat</div>
        <div class="top-sub">QR / GPS / vaqt</div>
      </div>
      <div class="acts">
        <span id="tb-user-name" class="tb-user-name">-</span>
        <span id="tb-user-role" class="tb-role" hidden></span>
      </div>
    </header>

    <main class="att-main" id="att-app">
      <div class="att-loading">Yuklanmoqda...</div>
    </main>
  </div>
</div>

<div id="fid-modal" class="fid-modal qr-mode" hidden aria-hidden="true">
  <div class="fid-backdrop"></div>
  <div class="fid-panel oq-panel" role="dialog" aria-modal="true" aria-labelledby="fid-title">
    <div class="oq-top">
      <span class="oq-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zm4 4h3v3h-3zm-4 0h.01"/></svg>
        QR
      </span>
      <button type="button" class="oq-close" id="fid-close" aria-label="Yopish">&times;</button>
    </div>
    <div class="oq-head">
      <h2 id="fid-title" class="oq-title">Keldim — QR scanner</h2>
      <p class="oq-sub" id="fid-sub">Ofis QR kodini yashil ramka ichiga tuting</p>
    </div>

    <div class="fid-viewport oq-viewport" id="fid-viewport">
      <video id="att-cam" class="fid-video oq-video" playsinline muted autoplay></video>
      <canvas id="att-overlay" class="fid-overlay" hidden></canvas>
      <div class="oq-frame" aria-hidden="true">
        <i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i>
        <span class="oq-laser"></span>
      </div>
      <div id="qr-reader" class="oq-reader" hidden></div>
    </div>

    <p class="oq-foot" id="fid-hint">QR kodni yashil burchakli ramka ichiga tuting</p>
    <div class="oq-status" id="fid-status">Kamera ochilmoqda…</div>
    <div class="fid-seg" id="fid-seg" hidden aria-hidden="true"></div>

    <div class="fid-actions" id="fid-actions" hidden>
      <button type="button" class="fid-btn fid-btn-in" id="fid-keldim">Keldim</button>
      <button type="button" class="fid-btn fid-btn-out" id="fid-ketdim">Ketdim</button>
    </div>
    <div class="fid-retry-wrap" id="fid-retry-wrap" hidden>
      <button type="button" class="fid-btn fid-btn-retry" id="fid-retry">Qayta urinish</button>
      <button type="button" class="fid-btn fid-btn-cancel" id="fid-cancel">Yopish</button>
    </div>
  </div>
</div>

<canvas id="att-canvas" hidden></canvas>

<div id="hb-edit-modal" class="hb-modal" hidden aria-hidden="true">
  <div class="hb-modal-backdrop" id="hb-edit-backdrop"></div>
  <div class="hb-modal-panel" role="dialog" aria-modal="true" aria-labelledby="hb-edit-title">
    <div class="hb-modal-head">
      <div>
        <h3 id="hb-edit-title">Davomat yozish</h3>
        <p class="hb-modal-sub" id="hb-edit-sub">—</p>
      </div>
      <button type="button" class="hb-modal-x" id="hb-edit-close" aria-label="Yopish">&times;</button>
    </div>
    <div class="hb-modal-body">
      <div class="hb-modal-grid">
        <label class="hb-modal-fld">
          <span>Kelish (HH:MM)</span>
          <input type="text" id="hb-edit-in" inputmode="numeric" placeholder="09:05" maxlength="5">
        </label>
        <label class="hb-modal-fld">
          <span>Ketish (HH:MM)</span>
          <input type="text" id="hb-edit-out" inputmode="numeric" placeholder="18:12" maxlength="5">
        </label>
      </div>
      <label class="hb-modal-fld">
        <span>Holat</span>
        <select id="hb-edit-holat">
          <option value="auto">Avto (vaqtdan)</option>
          <option value="present">Kelgan</option>
          <option value="late">Kech</option>
          <option value="absent">Kelmagan</option>
          <option value="vacation">Ta'til</option>
          <option value="no_out">Ketish yo'q</option>
        </select>
      </label>
      <label class="hb-modal-fld">
        <span>Izoh</span>
        <input type="text" id="hb-edit-note" placeholder="Ixtiyoriy" maxlength="500">
      </label>
    </div>
    <div class="hb-modal-foot">
      <button type="button" class="att-btn att-btn-face" id="hb-edit-cancel">Bekor</button>
      <button type="button" class="att-btn att-btn-in" id="hb-edit-save">Saqlash</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="auth.js?v=37"></script>
<script src="attendance.js?v=49"></script>
</body>
</html>
