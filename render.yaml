# VaksinaMed Fleet Control — Render Blueprint
# https://dashboard.render.com → New → Blueprint → GPS-VaksinaMed repo
#
# Eslatma: Vercel bu loyiha uchun mos emas (Python server + fon GPS sync + PostgreSQL).

services:
  - type: web
    name: gps-vaksinamed
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: VM_PRODUCTION
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: gps-vaksinamed-db
          property: connectionString
      - key: VM_SEED_PASS
        sync: false
      - key: GPS_SYNC_INTERVAL
        value: "300"
      # Ixtiyoriy — GPS avtomatik sync (panelda ham sozlash mumkin):
      # - key: GPS_HOST
      #   sync: false
      # - key: GPS_TOKEN
      #   sync: false
      # - key: GPS_USER
      #   sync: false
      # - key: GPS_PASSWORD
      #   sync: false
      # HR integratsiya (ixtiyoriy):
      # - key: VM_HR_API_KEY
      #   sync: false

databases:
  - name: gps-vaksinamed-db
    plan: free
    databaseName: vaksinamed
    user: vaksinamed
