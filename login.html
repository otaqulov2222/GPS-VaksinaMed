<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kirish — VaksinaMed Fleet Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scrollbar-width: thin; scrollbar-color: #5a6470 #161c24; }
* { scrollbar-width: thin; scrollbar-color: #5a6470 #161c24; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: #161c24; }
*::-webkit-scrollbar-thumb {
  background: #4a5460; border-radius: 8px; border: 2px solid #161c24;
}
*::-webkit-scrollbar-thumb:hover { background: #6b7380; }
*::-webkit-scrollbar-button,
*::-webkit-scrollbar-button:start:decrement,
*::-webkit-scrollbar-button:end:increment {
  display: none !important; width: 0; height: 0;
}
*::-webkit-scrollbar-corner { background: #161c24; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: #0c1016;
  color: #f4f4f2;
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    linear-gradient(180deg, rgba(12,16,22,.2), rgba(12,16,22,.92)),
    repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(255,255,255,.03) 40px),
    repeating-linear-gradient(0deg, transparent 0, transparent 39px, rgba(255,255,255,.03) 40px);
  pointer-events: none;
}
.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  border: 1px solid #2a323c;
  background: #161c24;
}
.top {
  padding: 22px 22px 16px;
  border-bottom: 1px solid #2a323c;
  background: #0c1016;
  text-align: center;
}
.brand-lockup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0 auto 16px;
}
.brand-lockup img, .brand-lockup svg {
  width: 52px; height: 52px; display: block; flex-shrink: 0;
}
.brand-name {
  font-size: 22px; font-weight: 700; letter-spacing: .03em;
  color: #c4a0de; line-height: 1; text-align: left;
}
.brand-name span { color: #e8b423; }
.brand-line {
  margin-top: 5px;
  font-size: 10px; font-weight: 600;
  letter-spacing: .18em;
  color: #c4a0de;
  text-align: left;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: #f4f4f2;
  -webkit-box-shadow: 0 0 0 1000px #0c1016 inset;
  caret-color: #f4f4f2;
  border-color: #c9a227;
}
h1 {
  font-size: 16px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; margin-top: 2px;
}
.form { padding: 22px; }
label {
  display: block; font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: #8b939e; margin-bottom: 6px;
}
input {
  width: 100%; height: 42px; padding: 0 12px;
  background: #0c1016; color: #f4f4f2;
  border: 1px solid #3a4450;
  font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  margin-bottom: 14px;
}
input:focus { outline: none; border-color: #c9a227; }
.pw-wrap {
  position: relative;
  margin-bottom: 14px;
}
.pw-wrap input {
  margin-bottom: 0;
  padding-right: 44px;
}
.pw-toggle {
  position: absolute; right: 0; top: 0;
  width: 42px; height: 42px;
  background: transparent; color: #8b939e;
  border: 0; cursor: pointer;
  font-size: 16px; letter-spacing: 0;
  display: flex; align-items: center; justify-content: center;
}
.pw-toggle svg { width: 18px; height: 18px; display: block; }
.pw-toggle.on { color: #c9a227; }
.err {
  display: none;
  background: #3a1515; color: #f3d0d0;
  border: 1px solid #9b1c1c;
  padding: 8px 10px; font-size: 12px; margin-bottom: 14px;
}
.err.show { display: block; }
.btn-go {
  width: 100%; height: 44px;
  background: #c9a227; color: #0c1016;
  border: 0; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
}
.btn-go:hover { background: #d4b03a; }
.btn-go:disabled { opacity: .55; cursor: default; }

html { -webkit-text-size-adjust: 100%; }
@media (max-width: 640px) {
  body { padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)); align-items: flex-start; }
  .wrap { max-width: 100%; }
  .brand-lockup { gap: 10px; }
  .brand-lockup img, .brand-lockup svg { width: 44px; height: 44px; }
  .brand-name { font-size: 18px; }
  input, .btn-go { font-size: 16px; min-height: 44px; }
  .form, .top { padding: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand-lockup">
      <img src="/logo/mark.svg?v=3" alt="">
      <div>
        <div class="brand-name">VAKSINA <span>MED</span></div>
        <div class="brand-line">MACHINE CONTROL</div>
      </div>
    </div>
    <h1>Tizimga kirish</h1>
  </div>
  <form class="form" id="f" autocomplete="on">
    <div class="err" id="err"></div>
    <label for="u">Login</label>
    <input id="u" name="username" autocomplete="username" autofocus>
    <label for="p">Parol</label>
    <div class="pw-wrap">
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-eye" title="Parolni ko'rsatish" aria-label="Parolni ko'rsatish">
        <svg id="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.3 21.3 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg>
      </button>
    </div>
    <button type="submit" class="btn-go" id="btn">Kirish</button>
  </form>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Tekshirilmoqda...';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || 'Kirish muvaffaqiyatsiz');
    location.replace(d.redirect || '/');
  } catch (ex) {
    err.textContent = ex.message || 'Xato';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Kirish';
  }
});

const eye = document.getElementById('pw-eye');
const pin = document.getElementById('p');
eye.addEventListener('click', () => {
  const show = pin.type === 'password';
  pin.type = show ? 'text' : 'password';
  eye.classList.toggle('on', show);
  eye.title = show ? "Parolni yashirish" : "Parolni ko'rsatish";
  document.getElementById('eye-on').style.display = show ? 'none' : 'block';
  document.getElementById('eye-off').style.display = show ? 'block' : 'none';
});
</script>
</body>
</html>
