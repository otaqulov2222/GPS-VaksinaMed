<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kirish — VaksinaMed Fleet Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --header: #0b1f3a;
  --header-2: #123050;
  --mark: #1a5fb4;
  --mark-2: #0b1f3a;
  --brand: #1a5fb4;
  --accent: #1a5fb4;
  --line: #c5d4e6;
  --muted: #5a7190;
  --ink-on: #0b1f3a;
}
html { scrollbar-width: thin; scrollbar-color: #8aa0b8 #eef3f9; }
* { scrollbar-width: thin; scrollbar-color: #8aa0b8 #eef3f9; }
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-track { background: #eef3f9; }
*::-webkit-scrollbar-thumb {
  background: #a8bdd4; border-radius: 8px; border: 2px solid #eef3f9;
}
*::-webkit-scrollbar-thumb:hover { background: #5a7190; }
*::-webkit-scrollbar-button,
*::-webkit-scrollbar-button:start:decrement,
*::-webkit-scrollbar-button:end:increment {
  display: none !important; width: 0; height: 0;
}
*::-webkit-scrollbar-corner { background: #eef3f9; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: #eef3f9;
  color: var(--ink-on);
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(26,95,180,.2), transparent 55%),
    radial-gradient(900px 500px at 90% 10%, rgba(142,182,223,.4), transparent 50%),
    radial-gradient(700px 420px at 50% 100%, rgba(26,95,180,.1), transparent 55%),
    linear-gradient(160deg, #eef3f9 0%, #f7fafc 50%, #e8eef5 100%);
  pointer-events: none;
}
.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 400px;
  border: 1px solid rgba(255,255,255,.65);
  background: #ffffff;
  border: 1px solid #c5d4e6;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(11, 31, 58, 0.08);
  overflow: hidden;
}
.top {
  padding: 22px 22px 16px;
  border-bottom: 1px solid rgba(197,212,230,.7);
  background: rgba(247,250,252,.85);
  text-align: center;
}
.brand-lockup {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 0 auto 16px;
}
.brand-lockup img, .brand-lockup svg {
  width: 52px; height: 52px; display: block; flex-shrink: 0;
}
.brand-name {
  font-size: 22px; font-weight: 700; letter-spacing: .03em;
  color: var(--brand); line-height: 1; text-align: left;
}
.brand-name span { color: var(--mark-2); }
.brand-line {
  margin-top: 5px;
  font-size: 10px; font-weight: 600;
  letter-spacing: .18em;
  color: var(--muted);
  text-align: left;
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: #0b1f3a;
  -webkit-box-shadow: 0 0 0 1000px #fff inset;
  caret-color: #0b1f3a;
  border-color: var(--mark);
}
h1 {
  font-size: 16px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; margin-top: 2px; color: var(--ink-on);
}
.form { padding: 22px; }
label {
  display: block; font-size: 10px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 6px;
}
input {
  width: 100%; height: 42px; padding: 0 12px;
  background: #fff; color: #0b1f3a;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: 'IBM Plex Mono', monospace; font-size: 14px;
  margin-bottom: 14px;
}
input:focus { outline: none; border-color: var(--mark); box-shadow: 0 0 0 3px rgba(26,95,180,.15); }
.pw-wrap {
  position: relative;
  margin-bottom: 14px;
}
.pw-wrap input {
  margin-bottom: 0;
  padding-right: 44px;
}
.pw-toggle {
  position: absolute; right: 0; top: 0;
  width: 42px; height: 42px;
  background: transparent; color: var(--muted);
  border: 0; cursor: pointer;
  font-size: 16px; letter-spacing: 0;
  display: flex; align-items: center; justify-content: center;
}
.pw-toggle svg { width: 18px; height: 18px; display: block; }
.pw-toggle.on { color: var(--mark); }
.err {
  display: none;
  background: #e8eef5; color: #0b1f3a;
  border: 1px solid #c5d4e6;
  border-radius: 10px;
  padding: 8px 10px; font-size: 12px; margin-bottom: 14px;
}
.err.show { display: block; }
.btn-go {
  width: 100%; height: 44px;
  background: var(--mark); color: #ffffff;
  border: 0; cursor: pointer;
  border-radius: 12px;
  font-family: inherit; font-size: 12px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  box-shadow: 0 8px 20px rgba(26,95,180,.28);
}
.btn-go:hover { background: #2a74c9; }
.btn-go:disabled { opacity: .55; cursor: default; }

html { -webkit-text-size-adjust: 100%; }
@media (max-width: 640px) {
  body { padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom)); align-items: flex-start; }
  .wrap { max-width: 100%; }
  .brand-lockup { gap: 10px; }
  .brand-lockup img, .brand-lockup svg { width: 44px; height: 44px; }
  .brand-name { font-size: 18px; }
  input, .btn-go { font-size: 16px; min-height: 44px; }
  .form, .top { padding: 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand-lockup">
      <img src="/logo/mark.svg?v=3" alt="">
      <div>
        <div class="brand-name">VAKSINA <span>MED</span></div>
        <div class="brand-line">MACHINE CONTROL</div>
      </div>
    </div>
    <h1>Tizimga kirish</h1>
  </div>
  <form class="form" id="f" autocomplete="on">
    <div class="err" id="err"></div>
    <label for="u">Login</label>
    <input id="u" name="username" autocomplete="username" autofocus>
    <label for="p">Parol</label>
    <div class="pw-wrap">
      <input id="p" name="password" type="password" autocomplete="current-password">
      <button type="button" class="pw-toggle" id="pw-eye" title="Parolni ko'rsatish" aria-label="Parolni ko'rsatish">
        <svg id="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg id="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.3 21.3 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/></svg>
      </button>
    </div>
    <button type="submit" class="btn-go" id="btn">Kirish</button>
  </form>
</div>
<script>
/** Fonida serverni isitish — loginni bloklamaydi */
fetch('/api/health', { cache: 'no-store' }).catch(() => {});

function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts || {}, { signal: ctrl.signal }))
    .finally(() => clearTimeout(t));
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Tekshirilmoqda...';
  try {
    const r = await fetchWithTimeout('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('u').value.trim(),
        password: document.getElementById('p').value
      })
    }, 45000);
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.ok) throw new Error(d.error || 'Kirish muvaffaqiyatsiz');
    location.replace(d.redirect || '/');
  } catch (ex) {
    const msg = String(ex.message || '');
    if (ex.name === 'AbortError' || msg === 'Failed to fetch' || msg.includes('NetworkError')) {
      err.textContent = 'Server sekin javob berdi. 10 soniya kutib, qayta Kirish bosing.';
    } else {
      err.textContent = msg || 'Xato';
    }
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Kirish';
  }
});

const eye = document.getElementById('pw-eye');
const pin = document.getElementById('p');
eye.addEventListener('click', () => {
  const show = pin.type === 'password';
  pin.type = show ? 'text' : 'password';
  eye.classList.toggle('on', show);
  eye.title = show ? "Parolni yashirish" : "Parolni ko'rsatish";
  document.getElementById('eye-on').style.display = show ? 'none' : 'block';
  document.getElementById('eye-off').style.display = show ? 'block' : 'none';
});
</script>
</body>
</html>
