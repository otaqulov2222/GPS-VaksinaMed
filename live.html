<!DOCTYPE html>
<html lang="uz">
<head>
<script src="canonical-url.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live — VaksinaMed GPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
<link rel="dns-prefetch" href="https://tile.openstreetmap.org">
<link rel="dns-prefetch" href="https://server.arcgisonline.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="shell.css?v=39"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body.app-body {
  background:
    radial-gradient(900px 420px at 12% -10%, rgba(26,95,180,.10), transparent 55%),
    radial-gradient(700px 380px at 100% 0%, rgba(20,122,50,.06), transparent 50%),
    #e8eef6;
  color: #0b1f3a;
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
}

/* Desktop topbar shows navigation context without duplicating rail user card */
@media (min-width: 1025px) {
  body.live-page .topbar .tb-user-name {
    display: none;
  }
}

.live-main {
  display: grid;
  grid-template-columns: 356px minmax(0, 1fr);
  gap: 14px;
  padding: 14px;
  height: calc(100dvh - 64px);
  min-height: 480px;
}

/* Mobile view switcher hidden on desktop */
.live-mob-bar {
  display: none;
}

.live-side,
.live-map-card {
  background: rgba(255, 255, 255, .96);
  border: 1px solid #d5e1ef;
  border-radius: 18px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
  box-shadow: 0 10px 28px rgba(11, 31, 58, .06);
}

/* ========== LEFT FLEET PANEL ========== */
.live-side-head {
  padding: 14px 14px 12px;
  border-bottom: 1px solid #e5edf6;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
}
.live-side-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.live-side-title-group {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.live-side-head h2 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: #526987;
}
.live-total-chip {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  background: #edf3fa;
  border: 1px solid #d4e2f0;
  font: 700 11px/1 'IBM Plex Mono', monospace;
  color: #1e3a5f;
}
.live-filter-reset {
  appearance: none;
  background: #eef4fb;
  border: 1px solid #c9daee;
  color: #1a5fb4;
  font: 600 11px/1 'IBM Plex Sans', sans-serif;
  padding: 4px 9px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
}
.live-filter-reset:hover {
  background: #e1ecfa;
  border-color: #9ec0e6;
}
.live-filter-reset[hidden] { display: none; }

/* Interactive KPI filter cards */
.live-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}
.live-stat {
  appearance: none;
  position: relative;
  border-radius: 12px;
  padding: 9px 6px 8px;
  text-align: center;
  border: 1px solid transparent;
  cursor: pointer;
  transition: transform .12s, box-shadow .15s, border-color .15s, opacity .15s, background .15s;
  font-family: inherit;
}
.live-stat:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(11, 31, 58, .08);
}
.live-stat:active { transform: translateY(0); }
.live-stat.is-move {
  background: linear-gradient(160deg, #e9f8ef 0%, #f5fcf7 100%);
  border-color: #c5e8d1;
}
.live-stat.is-stop {
  background: linear-gradient(160deg, #ebf2fc 0%, #f7faff 100%);
  border-color: #c7dbf1;
}
.live-stat.is-off {
  background: linear-gradient(160deg, #f3f6fa 0%, #fafcfe 100%);
  border-color: #dce4ee;
}
.live-stat.is-active.is-move {
  border-color: #16a34a;
  box-shadow: 0 0 0 2px rgba(22, 163, 74, .18), 0 4px 12px rgba(22, 163, 74, .12);
}
.live-stat.is-active.is-stop {
  border-color: #1a5fb4;
  box-shadow: 0 0 0 2px rgba(26, 95, 180, .18), 0 4px 12px rgba(26, 95, 180, .12);
}
.live-stat.is-active.is-off {
  border-color: #64748b;
  box-shadow: 0 0 0 2px rgba(100, 116, 139, .18), 0 4px 12px rgba(100, 116, 139, .1);
}
.live-stats.has-filter .live-stat:not(.is-active) {
  opacity: .56;
}
.live-stats.has-filter .live-stat:not(.is-active):hover {
  opacity: .9;
}
.live-stat-lbl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 9.5px;
  color: #526987;
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 4px;
  font-weight: 700;
}
.live-stat-lbl i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.live-stat.is-move .live-stat-lbl i { background: #16a34a; }
.live-stat.is-stop .live-stat-lbl i { background: #1a5fb4; }
.live-stat.is-off .live-stat-lbl i { background: #94a3b8; }
.live-stat b {
  display: block;
  font-size: 19px;
  line-height: 1.05;
  font-family: 'IBM Plex Mono', monospace;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.live-stat.is-move b { color: #15803d; }
.live-stat.is-stop b { color: #1a5fb4; }
.live-stat.is-off b { color: #64748b; }

/* Search */
.live-search-wrap {
  position: relative;
}
.live-search-wrap .live-search-ico {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: #6b829e;
  pointer-events: none;
}
.live-search {
  width: 100%;
  height: 38px;
  border: 1px solid #cbd9e8;
  border-radius: 11px;
  padding: 0 34px 0 34px;
  font: 13.5px/1 'IBM Plex Sans', sans-serif;
  background: #ffffff;
  color: #0b1f3a;
  transition: border-color .15s, box-shadow .15s;
}
.live-search::placeholder { color: #8da2ba; }
.live-search:focus {
  outline: none;
  border-color: #1a5fb4;
  box-shadow: 0 0 0 3px rgba(26, 95, 180, .14);
}
.live-search::-webkit-search-cancel-button { display: none; }
.live-search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 22px;
  height: 22px;
  border-radius: 999px;
  border: none;
  background: #eef4fb;
  color: #4a627e;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.live-search-clear:hover {
  background: #dce8f6;
  color: #0b1f3a;
}
.live-search-clear[hidden] { display: none; }

/* Fleet Vehicle List */
.live-list {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.live-list::-webkit-scrollbar { width: 5px; }
.live-list::-webkit-scrollbar-track { background: transparent; }
.live-list::-webkit-scrollbar-thumb {
  background: #cbd9e8;
  border-radius: 999px;
}
.live-list::-webkit-scrollbar-thumb:hover { background: #9db6d2; }

.live-row {
  position: relative;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 9px 11px;
  border-radius: 13px;
  cursor: pointer;
  border: 1px solid #eef3f9;
  background: #ffffff;
  transition: background .14s, border-color .14s, box-shadow .14s, transform .12s;
}
.live-row:hover {
  background: #f6f9fd;
  border-color: #d3e1f0;
}
.live-row.is-moving {
  background: linear-gradient(115deg, #f3fcf6 0%, #ffffff 70%);
  border-color: #d5efe0;
}
.live-row.is-moving:hover {
  background: linear-gradient(115deg, #ebf9f0 0%, #f9fdfb 75%);
  border-color: #aedec0;
}
.live-row.is-offline {
  opacity: .84;
}
.live-row.on {
  background: linear-gradient(115deg, #ebf3fd 0%, #f8fbff 85%) !important;
  border-color: #7eb0e6 !important;
  box-shadow: inset 3px 0 0 #1a5fb4, 0 4px 12px rgba(26, 95, 180, .10);
  opacity: 1;
}
.live-row.is-moving.on {
  border-color: #22a04a !important;
  box-shadow: inset 3px 0 0 #16a34a, 0 4px 12px rgba(22, 163, 74, .12);
}

.live-avatar {
  position: relative;
  width: 52px;
  height: 38px;
  padding: 3px 4px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  overflow: visible;
}
.live-avatar.move {
  background: linear-gradient(160deg, #e7f8ee, #f8fdf9);
  border: 1px solid #bce8ce;
}
.live-avatar.stop {
  background: linear-gradient(160deg, #ebf3fd, #f8fbff);
  border: 1px solid #cadcf2;
}
.live-avatar.off {
  background: #f2f5f9;
  border: 1px solid #dde5ef;
}
.live-avatar .live-list-photo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  filter: drop-shadow(0 2px 3px rgba(11, 31, 58, .18));
}
.live-avatar.off .live-list-photo {
  filter: grayscale(.85) opacity(.72);
}
.live-avatar-dot {
  position: absolute;
  top: -3px;
  right: -3px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 2px solid #ffffff;
  box-shadow: 0 1px 3px rgba(11, 31, 58, .22);
}
.live-avatar.move .live-avatar-dot {
  background: #16a34a;
  box-shadow: 0 0 0 2px rgba(22, 163, 74, .22);
}
.live-avatar.stop .live-avatar-dot { background: #1a5fb4; }
.live-avatar.off .live-avatar-dot { background: #94a3b8; }

.live-row-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.live-row-top {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.live-car {
  font-weight: 700;
  font-size: 13px;
  line-height: 1.2;
  color: #0b1f3a;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: -.01em;
  white-space: nowrap;
}
.live-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
}
.live-badge.move { background: #dcf5e6; color: #15803d; }
.live-badge.stop { background: #e3eefb; color: #1a5fb4; }
.live-badge.off { background: #eef2f6; color: #64748b; }
.live-badge.move .pulse {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #16a34a;
  animation: liveBlink 1.1s ease-in-out infinite;
}
.live-drv {
  font-size: 12px;
  line-height: 1.25;
  color: #4f6682;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.live-meta {
  text-align: right;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.live-meta .spd {
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px;
  font-weight: 700;
  color: #334e6f;
  padding: 2px 7px;
  border-radius: 7px;
  background: #f1f5f9;
}
.live-meta .spd small {
  font-size: 9.5px;
  font-weight: 600;
  opacity: .78;
}
.live-meta .spd.hot {
  background: #dcf5e6;
  color: #15803d;
}
.live-meta .spd.off {
  background: transparent;
  color: #94a3b8;
  padding-right: 0;
}
.live-meta .age {
  font-size: 10.5px;
  font-weight: 500;
  color: #7c92ac;
  font-family: 'IBM Plex Mono', monospace;
}

/* ========== MAP CARD & HEADER ========== */
.live-map-head {
  padding: 9px 14px;
  border-bottom: 1px solid #e4edf6;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: nowrap;
  background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
}
.live-map-head-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  flex: 1 1 auto;
}
.live-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 32px;
  padding: 0 11px 0 9px;
  border-radius: 999px;
  background: #f2f7fc;
  border: 1px solid #d7e3ef;
  color: #2f4968;
  font: 500 11.5px/1 'IBM Plex Mono', monospace;
  white-space: nowrap;
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-status-pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #16a34a;
  box-shadow: 0 0 0 3px rgba(22, 163, 74, .2);
  flex-shrink: 0;
  animation: liveBlink 1.5s ease-in-out infinite;
}
.live-status-pill.is-err .dot {
  background: #dc2626;
  box-shadow: 0 0 0 3px rgba(220, 38, 38, .2);
  animation: none;
}

.live-legend {
  display: flex;
  gap: 5px;
  align-items: center;
}
.live-legend span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 9px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid #e2ebf4;
  font-size: 11px;
  font-weight: 600;
  color: #4a627e;
}
.live-legend i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.live-legend .lg-move { background: #16a34a; box-shadow: 0 0 0 2px rgba(22, 163, 74, .2); }
.live-legend .lg-stop { background: #1a5fb4; }
.live-legend .lg-off { background: #94a3b8; }

.live-map-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  flex-shrink: 0;
  margin-left: auto;
}

/* Segmented layer switch (Xarita / Sun'iy) */
.live-layer-seg {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border-radius: 10px;
  background: #eef3f9;
  border: 1px solid #d5e1ee;
  gap: 2px;
}
.live-layer-btn {
  appearance: none;
  border: none;
  background: transparent;
  color: #4b6482;
  font: 600 11.5px/1 'IBM Plex Sans', sans-serif;
  height: 26px;
  padding: 0 10px;
  border-radius: 7px;
  cursor: pointer;
  transition: background .15s, color .15s, box-shadow .15s;
}
.live-layer-btn:hover { color: #0b1f3a; }
.live-layer-btn.on {
  background: #ffffff;
  color: #0b1f3a;
  box-shadow: 0 1px 3px rgba(11, 31, 58, .12);
}

.live-btn {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  border-radius: 10px;
  border: 1px solid transparent;
  font: 600 12px/1 'IBM Plex Sans', sans-serif;
  letter-spacing: .01em;
  cursor: pointer;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .12s, color .15s;
  white-space: nowrap;
  user-select: none;
}
.live-btn svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
.live-btn:active { transform: translateY(1px); }
.live-btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(26, 95, 180, .22);
}
.live-btn-ghost {
  background: #ffffff;
  border-color: #cbd9e8;
  color: #1a3a5c;
  box-shadow: 0 1px 2px rgba(11, 31, 58, .04);
}
.live-btn-ghost:hover {
  background: #f3f7fc;
  border-color: #9cb6d2;
  color: #0b1f3a;
}
.live-btn-primary {
  background: linear-gradient(180deg, #2b74cf 0%, #1a5fb4 100%);
  border-color: #15539e;
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(26, 95, 180, .26);
}
.live-btn-primary:hover {
  background: linear-gradient(180deg, #3480db 0%, #1f6ac4 100%);
  box-shadow: 0 6px 16px rgba(26, 95, 180, .34);
}
.live-btn.is-busy {
  pointer-events: none;
  opacity: .75;
}
.live-btn.is-busy svg {
  animation: liveSpin .8s linear infinite;
}
@keyframes liveSpin { to { transform: rotate(360deg); } }
.live-btn-txt-short { display: none; }

/* Map viewport container */
.live-map-stage {
  position: relative;
  flex: 1;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}
#live-map {
  flex: 1;
  min-height: 260px;
  background: #dbe5f0;
}
#live-map .leaflet-control-zoom {
  border: 1px solid #cbd9e8 !important;
  box-shadow: 0 8px 22px rgba(11, 31, 58, .12) !important;
  border-radius: 12px !important;
  overflow: hidden;
}
#live-map .leaflet-control-zoom a {
  width: 34px !important;
  height: 34px !important;
  line-height: 34px !important;
  color: #1a3a5c !important;
  border-bottom-color: #e4edf6 !important;
  font-size: 16px !important;
  font-weight: 600 !important;
}
#live-map .leaflet-control-zoom a:hover {
  background: #f3f7fb !important;
  color: #1a5fb4 !important;
}
#live-map .vm-gz-toggle {
  border: 1px solid #cbd9e8 !important;
  border-radius: 10px !important;
  padding: 6px 11px !important;
  box-shadow: 0 6px 18px rgba(11, 31, 58, .12) !important;
  font-size: 11.5px !important;
}

/* ========== MAP MARKERS & CLUSTERS ========== */
.live-pin,
.live-arrow-pin,
.live-cluster-pin,
.leaflet-div-icon.live-pin,
.leaflet-div-icon.live-arrow-pin,
.leaflet-div-icon.live-cluster-pin {
  background: transparent !important;
  border: none !important;
  box-shadow: none !important;
  outline: none !important;
}

/* Clean cluster pill */
.live-cluster {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  height: 44px;
  padding: 0 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .96);
  border: 2.5px solid #1a5fb4;
  box-shadow: 0 8px 22px rgba(11, 31, 58, .22), 0 0 0 4px rgba(26, 95, 180, .14);
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}
.live-cluster:hover {
  transform: scale(1.08);
  box-shadow: 0 10px 26px rgba(11, 31, 58, .28), 0 0 0 6px rgba(26, 95, 180, .18);
}
.live-cluster.has-move {
  border-color: #16a34a;
  box-shadow: 0 8px 22px rgba(11, 31, 58, .22), 0 0 0 4px rgba(22, 163, 74, .16);
}
.live-cluster-n {
  font: 700 14px/1 'IBM Plex Mono', monospace;
  color: #0b1f3a;
}
.live-cluster-move {
  position: absolute;
  top: -6px;
  right: -7px;
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  border-radius: 999px;
  background: #16a34a;
  border: 2px solid #ffffff;
  color: #ffffff;
  font: 700 10px/15px 'IBM Plex Mono', monospace;
  text-align: center;
  box-shadow: 0 2px 6px rgba(22, 163, 74, .38);
}

/* Vehicle marker on map — exact (22,22) center anchor, plate tag floats cleanly below */
.live-marker {
  position: relative;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.live-unit {
  position: relative;
  width: 24px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  transform-origin: 50% 50%;
  will-change: transform;
  pointer-events: auto;
  cursor: pointer;
}
.live-top-img {
  width: 22px !important;
  height: 42px !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: contain;
  display: block;
  pointer-events: none;
  user-select: none;
  -webkit-user-drag: none;
  image-rendering: auto;
}
.live-marker.model-isuzu .live-unit,
.live-marker.model-labo .live-unit,
