# Bir martalik: hujjat muddatlarini Neon ga yozish.
# Actions → Import docs → Run workflow

name: Import docs

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Import document deadlines
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VM_PRODUCTION: '1'
        run: python scripts/import_docs.py
