# Kunlik to'liq GPS odat — GitHub Actions (Vercel Fluid 25s limitsiz).
#
# MUAMMO: GitHub schedule kechikadi/yutiladi.
# YECHIM:
#   - soatlik + yarim soatlik heartbeat (Toshkent 05–22)
#   - job ICHIDA ~50 daqiqa loop (har ~3 daqiqa sync)
#   - yangi kun boshida (synced=0) birinchi bo'lib to'ldirish
#
# Toshkent 05–22 ≈ UTC 00–17
#
# Secrets: DATABASE_URL (majburiy). GPS_TOKEN yoki panel orqali Neon config.

name: GPS sync

on:
  schedule:
    # Har soat :07 — asosiy (Toshkent 05–22)
    - cron: '7 0-17 * * *'
    # :22 va :37 — GitHub yutib yuborsa zaxira
    - cron: '22 0-17 * * *'
    - cron: '37 0-17 * * *'
  workflow_dispatch:

concurrency:
  group: gps-sync-habit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Show sync script version
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "EVENT=${GITHUB_EVENT_NAME}"
          echo "--- run_gps_cron.py (birinchi 45 qator) ---"
          sed -n '1,45p' scripts/run_gps_cron.py

      - name: Run daily GPS habit (hourly loop)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GPS_HOST: ${{ secrets.GPS_HOST }}
          GPS_TOKEN: ${{ secrets.GPS_TOKEN }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASSWORD: ${{ secrets.GPS_PASSWORD }}
          VM_PRODUCTION: '1'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GPS_REFRESH_EVERY_SEC: '180'
          GPS_CRON_LOOP_MIN: '50'
          GPS_CRON_LOOP_SLEEP: '180'
        run: python scripts/run_gps_cron.py
