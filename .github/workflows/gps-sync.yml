# Kunlik to'liq GPS odat — GitHub Actions (Vercel Fluid 25s limitsiz).
#
# MUAMMO: GitHub `*/10 * * * *` schedule ishonchsiz — soatlab kechikadi/yutiladi.
# YECHIM: har soat ishga tushadi + job ICHIDA ~50 daqiqa loop (har ~3 daqiqa sync).
#
# Toshkent ish kuni 06–22 ≈ UTC 01–17
#
# GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL   — Neon pooler URL (Vercel dagi bilan bir xil)
#   GPS_HOST       — ixtiyoriy (default bms1.gpsavto.uz)
#   GPS_TOKEN      — yoki GPS_USER + GPS_PASSWORD
#   GPS_USER
#   GPS_PASSWORD
#
# Eslatma: GPS config Neon da saqlangan bo'lsa (panel orqali),
# faqat DATABASE_URL yetadi.

name: GPS sync

on:
  schedule:
    # Har soat :07 UTC — ish kunida (Toshkent 06–22)
    - cron: '7 1-17 * * *'
  workflow_dispatch:

concurrency:
  group: gps-sync-habit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Show sync script version
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "--- run_gps_cron.py (birinchi 40 qator) ---"
          sed -n '1,40p' scripts/run_gps_cron.py

      - name: Run daily GPS habit (hourly loop)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GPS_HOST: ${{ secrets.GPS_HOST }}
          GPS_TOKEN: ${{ secrets.GPS_TOKEN }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASSWORD: ${{ secrets.GPS_PASSWORD }}
          VM_PRODUCTION: '1'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GPS_REFRESH_EVERY_SEC: '180'
          # Bitta job ichida 50 daqiqa: har ~3 daqiqada yangilash
          GPS_CRON_LOOP_MIN: '50'
          GPS_CRON_LOOP_SLEEP: '180'
        run: python scripts/run_gps_cron.py
