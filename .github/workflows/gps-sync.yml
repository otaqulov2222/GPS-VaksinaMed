# GPS sync har 5 daqiqa — GitHub Actions da (Vercel Fluid 25s limiti yo'q).
#
# GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL   — Neon pooler URL (Vercel dagi bilan bir xil)
#   GPS_HOST       — ixtiyoriy (default bms1.gpsavto.uz)
#   GPS_TOKEN      — yoki GPS_USER + GPS_PASSWORD
#   GPS_USER
#   GPS_PASSWORD
#
# Eslatma: GPS config Neon da saqlangan bo'lsa (panel orqali),
# faqat DATABASE_URL yetadi.

name: GPS sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Show sync script version
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "--- run_gps_cron.py (birinchi 35 qator) ---"
          sed -n '1,35p' scripts/run_gps_cron.py

      - name: Run GPS sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GPS_HOST: ${{ secrets.GPS_HOST }}
          GPS_TOKEN: ${{ secrets.GPS_TOKEN }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASSWORD: ${{ secrets.GPS_PASSWORD }}
          VM_PRODUCTION: '1'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python scripts/run_gps_cron.py
