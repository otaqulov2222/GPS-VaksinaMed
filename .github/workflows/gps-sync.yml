# Kunlik to'liq GPS odat — GitHub Actions (Vercel Fluid 25s limitsiz).
#
# Har 10 daqiqada:
#   - yetishmagan mashinalarni to'ldiradi
#   - ish vaqtida (06–22 Toshkent) 15 daqiqadan eski bo'lsa hammasi yangilanadi
#
# GitHub → Settings → Secrets and variables → Actions:
#   DATABASE_URL   — Neon pooler URL (Vercel dagi bilan bir xil)
#   GPS_HOST       — ixtiyoriy (default bms1.gpsavto.uz)
#   GPS_TOKEN      — yoki GPS_USER + GPS_PASSWORD
#   GPS_USER
#   GPS_PASSWORD
#
# Eslatma: GPS config Neon da saqlangan bo'lsa (panel orqali),
# faqat DATABASE_URL yetadi.

name: GPS sync

on:
  schedule:
    # Har 10 daqiqa — kunlik odat (UTC; Toshkent = UTC+5)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Show sync script version
        run: |
          echo "COMMIT=$(git rev-parse --short HEAD)"
          echo "--- run_gps_cron.py (birinchi 40 qator) ---"
          sed -n '1,40p' scripts/run_gps_cron.py

      - name: Run daily GPS habit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GPS_HOST: ${{ secrets.GPS_HOST }}
          GPS_TOKEN: ${{ secrets.GPS_TOKEN }}
          GPS_USER: ${{ secrets.GPS_USER }}
          GPS_PASSWORD: ${{ secrets.GPS_PASSWORD }}
          VM_PRODUCTION: '1'
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GPS_REFRESH_EVERY_SEC: '900'
        run: python scripts/run_gps_cron.py
