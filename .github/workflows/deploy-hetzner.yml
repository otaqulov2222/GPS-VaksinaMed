# Push → Hetzner serverni darhol yangilash (CRON_SECRET orqali).
# Zaxira: serverda har 1 daqiqalik systemd timer ham pull qiladi.
#
# Secrets: CRON_SECRET (majburiy, darhol deploy uchun).
# Ixtiyoriy: HETZNER_DEPLOY_URL (default: https://vaksinamedgps.uz/api/cron/deploy)

name: Deploy Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger server deploy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HETZNER_DEPLOY_URL: ${{ secrets.HETZNER_DEPLOY_URL }}
        run: |
          set -euo pipefail
          URL="${HETZNER_DEPLOY_URL:-https://vaksinamedgps.uz/api/cron/deploy}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET yo'q — darhol trigger o'tkazib yuborildi."
            echo "Server timer (1 daqiqa) baribir pull qiladi (agar o'rnatilgan bo'lsa)."
            echo "URL: $URL"
            exit 0
          fi
          echo "POST $URL"
          code=$(curl -sS -o /tmp/deploy-out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "$URL" || true)
          echo "HTTP $code"
          cat /tmp/deploy-out.json || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "Deploy endpoint javob bermadi — server timer 1 daqiqada pull qiladi."
            exit 0
          fi
          echo "Deploy qabul qilindi."
