# Push → Hetzner serverni darhol yangilash (CRON_SECRET orqali).
# Zaxira: serverda har 1 daqiqalik systemd timer ham pull qiladi.
#
# Secrets: CRON_SECRET (majburiy). Ixtiyoriy: HETZNER_DEPLOY_URL

name: Deploy Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger server deploy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HETZNER_DEPLOY_URL: ${{ secrets.HETZNER_DEPLOY_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret yo'q — faqat server timer (1 daqiqa) ishlaydi."
            exit 0
          fi
          URL="${HETZNER_DEPLOY_URL:-http://49.13.152.181/api/cron/deploy}"
          echo "POST $URL"
          code=$(curl -sS -o /tmp/deploy-out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            "$URL" || true)
          echo "HTTP $code"
          cat /tmp/deploy-out.json || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo "Deploy endpoint javob bermadi — server timer 1 daqiqada pull qiladi."
            exit 0
          fi
